# =============================================================================
# Lord Gainsborough API - PostgreSQL Migration Profile Configuration
# Profile: postgres-migration
# Activation: --spring.profiles.active=postgres-migration
# Description: Configures isolated PostgreSQL DataSource, HikariCP connection pool,
#              and Flyway migrations for PostgreSQL migration and smoke testing.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Re-enable Relational Auto-Configurations
# Overrides default exclusion from application.properties so that DataSource,
# Flyway, and Hibernate auto-configurations run when this profile is active.
# -----------------------------------------------------------------------------
spring.autoconfigure.exclude=

# -----------------------------------------------------------------------------
# 2. PostgreSQL DataSource & JDBC Connectivity
# -----------------------------------------------------------------------------
# Uses standard environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
# DB_SSL_MODE defaults to 'prefer' for local development/testing; set to 'require' for Supabase.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# 3. HikariCP Connection Pool Settings
# -----------------------------------------------------------------------------
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=LordGainsboroughHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# -----------------------------------------------------------------------------
# 4. Flyway Database Migrations
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# -----------------------------------------------------------------------------
# 5. Spring Data JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
# Keep ddl-auto=none to prevent premature schema modifications or validation
# failures before JPA entity classes are fully introduced in subsequent phases.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
