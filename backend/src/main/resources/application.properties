spring.application.name=restaurant-api

# --- Secrets are read from environment variables (see application.properties.example) ---
# MongoDB connection string, e.g. mongodb+srv://user:pass@cluster/db?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:LordGainsBorough}
spring.data.mongodb.auto-index-creation=true
server.port=8082
socketio.port=9092

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Security & Protocol Rules
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Request timeouts to prevent system freezes
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com

# Email sender (must be verified in Brevo dashboard)
app.mail.from=${MAIL_FROM:lordgainsborough5@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Lord Gainsborough}
# Never enable in production: logs raw OTP codes to the server console.
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:false}

# Optional: Brevo REST API key (xkeysib-...) for more reliable delivery than SMTP alone
brevo.api-key=${BREVO_API_KEY:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
