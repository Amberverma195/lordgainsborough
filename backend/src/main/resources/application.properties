spring.application.name=restaurant-api

# --- Secrets are read from environment variables (see application.properties.example) ---
server.port=${PORT:8082}
socketio.port=9092
socketio.origin=${SOCKETIO_ORIGIN:http://localhost:3000}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Structured logs include SLF4J key/value fields. Never enable payload/request-detail logging.
logging.structured.format.console=logstash
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=OFF
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.http.client=WARN
logging.level.org.springframework.http.converter=WARN
logging.level.org.apache.hc.client5.http.wire=OFF

# Actuator/Prometheus binds to loopback by default. Set address explicitly for a secured scraper.
management.server.port=${MANAGEMENT_SERVER_PORT:8083}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Resend Email API Configuration
resend.api-key=${RESEND_API_KEY:}
resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
resend.connect-timeout-ms=${RESEND_CONNECT_TIMEOUT_MS:5000}
resend.read-timeout-ms=${RESEND_READ_TIMEOUT_MS:8000}

# Email sender (verified in Resend dashboard)
app.mail.from=${MAIL_FROM:no-reply@lordgainsboroughrestaurant.ca}
app.mail.from-name=${MAIL_FROM_NAME:Lord Gainsborough}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Signup OTP attempt-token recovery HMAC secret (supports comma-separated secrets for zero-downtime rotation)
app.auth.signup.attempt-token-secrets=${SIGNUP_ATTEMPT_TOKEN_SECRETS:${SIGNUP_ATTEMPT_TOKEN_SECRET:}}

# Signup OTP secondary abuse limits (PostgreSQL fixed-window counters; IP stored as keyed hash)
app.abuse.ip-hash-secret=${ABUSE_IP_HASH_SECRET}
app.abuse.trusted-proxies=${ABUSE_TRUSTED_PROXIES:127.0.0.1,::1}
app.abuse.initial-sends-per-ip=${ABUSE_INITIAL_SENDS_PER_IP:20}
app.abuse.initial-send-window=${ABUSE_INITIAL_SEND_WINDOW:PT15M}
app.abuse.total-sends-per-ip=${ABUSE_TOTAL_SENDS_PER_IP:100}
app.abuse.total-send-window=${ABUSE_TOTAL_SEND_WINDOW:PT24H}
app.abuse.verifications-per-ip=${ABUSE_VERIFICATIONS_PER_IP:60}
app.abuse.verification-window=${ABUSE_VERIFICATION_WINDOW:PT15M}
app.abuse.global-provider-sends=${ABUSE_GLOBAL_PROVIDER_SENDS:200}
app.abuse.global-provider-window=${ABUSE_GLOBAL_PROVIDER_WINDOW:PT1M}
app.abuse.captcha-after-initial-sends=${ABUSE_CAPTCHA_AFTER_INITIAL_SENDS:12}
app.abuse.captcha-enabled=${ABUSE_CAPTCHA_ENABLED:false}
app.abuse.captcha-shared-token=${ABUSE_CAPTCHA_SHARED_TOKEN:}

# Login security (PostgreSQL-authoritative)
app.auth.login.ip-attempts=${LOGIN_IP_ATTEMPTS:20}
app.auth.login.ip-window=${LOGIN_IP_WINDOW:PT5M}
app.auth.login.identifier-ip-failures=${LOGIN_IDENTIFIER_IP_FAILURES:5}
app.auth.login.failure-window=${LOGIN_FAILURE_WINDOW:PT5M}
app.auth.login.cooldown=${LOGIN_COOLDOWN:PT30S}

# Password-reset security (PostgreSQL-authoritative)
app.auth.password-reset.resend-cooldown=${PASSWORD_RESET_RESEND_COOLDOWN:PT30S}
app.auth.password-reset.max-resends=${PASSWORD_RESET_MAX_RESENDS:5}
app.auth.password-reset.code-ttl=${PASSWORD_RESET_CODE_TTL:PT10M}
app.auth.password-reset.challenge-ttl=${PASSWORD_RESET_CHALLENGE_TTL:PT30M}
app.auth.password-reset.max-verification-failures=${PASSWORD_RESET_MAX_VERIFICATION_FAILURES:5}
app.auth.password-reset.new-challenges-per-email=${PASSWORD_RESET_NEW_CHALLENGES_PER_EMAIL:3}
app.auth.password-reset.new-challenge-window=${PASSWORD_RESET_NEW_CHALLENGE_WINDOW:PT1H}
app.auth.password-reset.email-operations-per-ip=${PASSWORD_RESET_EMAIL_OPERATIONS_PER_IP:10}
app.auth.password-reset.email-operation-window=${PASSWORD_RESET_EMAIL_OPERATION_WINDOW:PT15M}
app.auth.password-reset.verifications-per-ip=${PASSWORD_RESET_VERIFICATIONS_PER_IP:30}
app.auth.password-reset.verification-window=${PASSWORD_RESET_VERIFICATION_WINDOW:PT15M}
app.auth.password-reset.global-email-operations=${PASSWORD_RESET_GLOBAL_EMAIL_OPERATIONS:100}
app.auth.password-reset.global-email-window=${PASSWORD_RESET_GLOBAL_EMAIL_WINDOW:PT1M}
app.auth.password-reset.send-lease=${PASSWORD_RESET_SEND_LEASE:PT1M}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# 3. HikariCP Connection Pool Settings
# -----------------------------------------------------------------------------
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=LordGainsboroughHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# -----------------------------------------------------------------------------
# 4. Flyway Database Migrations
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# -----------------------------------------------------------------------------
# 5. Spring Data JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
# Keep ddl-auto=validate to prevent premature schema modifications or validation
# failures before JPA entity classes are fully introduced in subsequent phases.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
